# Cloudflare Workers 配置；上游同步手动执行，deploy.yml 仅接受手动触发
name = "cf-server-monitor"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

keep_vars = true

[[routes]]
pattern = "cfsm.11112003.xyz"
custom_domain = true

# 定时任务配置（UTC）
# - 每小时：执行表轮换和到期检测
# - 离线/资源告警由 Uptime Kuma 负责，避免每分钟 Cron 消耗 Workers 额度
# - 注意同步修改 .github/workflows/deploy.yml
[triggers]
crons = ["0 * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "server-monitor-db"
database_id = "c5f653ac-8839-4b19-aec0-f538165f9588"

[vars]
# 用户名及跨域设置由既有 Worker 管理；keep_vars 保留线上原值。
# 不在本地模板重复声明，避免手动部署覆盖现有实例配置。
EDGE_BACKUP_HEALTH_URL = "https://wallos.11112003.xyz/images/uploads/logos/edgeever-backup-health.json"

# Durable Objects：实时指标广播中心
# 注意：首次部署前需要执行 `wrangler durable-object create MetricsBroadcaster --class MetricsBroadcaster`
# 或者在部署后，wrangler 会自动创建对应的 DO namespace。
[[durable_objects.bindings]]
name = "METRICS_BROADCASTER"
class_name = "MetricsBroadcaster"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MetricsBroadcaster"]

# 开发服务器配置
[dev]
port = 8787
local_protocol = "https"
