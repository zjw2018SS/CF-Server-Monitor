name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - id: decide
        run: |
          if [ -n "$CF_ACCOUNT_ID" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          EVENT_NAME: ${{ github.event_name }}

  deploy:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🏗️ Build frontend assets
        run: npm run build:frontend

      - name: 📝 Create wrangler.toml
        run: |
          cat > wrangler.toml << 'WEOF'
          name = "cf-server-monitor"
          main = "src/index.js"
          compatibility_date = "2024-12-01"
          compatibility_flags = ["nodejs_compat"]
          workers_dev = false
          keep_vars = true

          [[routes]]
          pattern = "cfsm.11112003.xyz"
          custom_domain = true

          # 定时任务配置（UTC）
          # - 每小时：执行表轮换和到期检测
          # - 离线/资源告警由 Uptime Kuma 负责，避免每分钟 Cron 消耗 Workers 额度
          [triggers]
          crons = ["0 * * * *"]

          [assets]
          directory = "./dist"
          binding = "ASSETS"

          [[d1_databases]]
          binding = "DB"
          database_name = "server-monitor-db"
          database_id = "D1_PLACEHOLDER"

          # Durable Objects：实时指标广播中心
          [[durable_objects.bindings]]
          name = "METRICS_BROADCASTER"
          class_name = "MetricsBroadcaster"

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["MetricsBroadcaster"]

          [vars]
          API_USER_NAME = "USER_NAME_PLACEHOLDER"
          CORS_ALLOWED_ORIGINS = "CORS_ORIGINS_PLACEHOLDER"
          EDGE_BACKUP_HEALTH_URL = "https://wallos.11112003.xyz/images/uploads/logos/edgeever-backup-health.json"
          WEOF

          # 替换占位符
          sed -i "s|D1_PLACEHOLDER|${{ secrets.D1_DATABASE_ID }}|g" wrangler.toml
          sed -i "s|USER_NAME_PLACEHOLDER|${{ secrets.API_USER_NAME }}|g" wrangler.toml
          sed -i "s|CORS_ORIGINS_PLACEHOLDER|${{ secrets.CORS_ALLOWED_ORIGINS }}|g" wrangler.toml

          echo "✅ wrangler.toml 已生成"

      # wrangler v4 的 `deploy` 会自动根据 wrangler.toml 中的 [[durable_objects.bindings]]
      # 声明创建 DO namespace（幂等：已存在则跳过），无需单独命令。
      # 前提：MetricsBroadcaster 类必须从 index.js 导出（已通过 src/index.js 实现）。
      - name: 🚀 Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy

      - name: 🔐 Store API secret in Cloudflare
        run: printf '%s' "$API_SECRET" | npx wrangler secret put API_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          API_SECRET: ${{ secrets.API_SECRET }}

      - name: ✅ Deployment Success
        if: success()
        run: |
          echo "============================================"
          echo "  🎉 部署成功！"
          echo "============================================"

      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "============================================"
          echo "  💥 部署失败！请检查 Actions 日志"
          echo "============================================"
